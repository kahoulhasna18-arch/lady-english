# Static site: index.html and its assets live at the repository root.
[build]
  publish = "."

# Security headers for every page. No Content-Security-Policy is set so that
# Google Fonts and the Google Translate widget keep working unchanged.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
